events {
    worker_connections 1024;
}

http {
    include mime.types;

    # comprime arquivos de texto antes de enviar
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    # balanceamento de carga: por padrao o nginx usa round robin
    upstream servidores {
        server servidor1:3000;
        server servidor2:3000;
    }

    server {
        listen 80;

        # arquivos estaticos (html, css e js)
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # proxy reverso: o que chega em /api/ vai para os servidores node
        location /api/ {
            proxy_pass http://servidores;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
        }
    }
}
